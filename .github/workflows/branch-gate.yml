# Branch gate: feature/<ISSUE-ID> -> develop -> main, each hop test-gated.
# Policy: ~/.config/agent-policy/git-workflow.md
#
# This repo has no test suite and no Python, so the gate runs the two real,
# network-light checks that actually cover the tracked content:
#   1. shellcheck (error severity) over every tracked *.sh
#   2. hadolint  (error severity) over every tracked Dockerfile
# Both steps fail the job on real findings. Nothing here is a no-op step, and
# no step pretends to run a test suite that does not exist.

name: Branch Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Tests (branch gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax gate (shellcheck)
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::warning::No tracked shell scripts found - the shell gate has nothing to check."
            exit 0
          fi

          echo "Tracked shell scripts to check (${#scripts[@]}):"
          printf '  %s\n' "${scripts[@]}"

          failed=0
          for s in "${scripts[@]}"; do
            echo "::group::shellcheck $s"
            rc=0
            output="$(shellcheck --severity=error --color=never "$s" 2>&1)" || rc=$?
            if [ -n "$output" ]; then
              echo "$output"
            fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$s::shellcheck reported errors (exit $rc) in $s"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Shell gate FAILED - offending files are listed above."
            exit 1
          fi
          echo "Shell gate PASSED: no shellcheck errors in ${#scripts[@]} tracked script(s)."

      - name: Dockerfile syntax gate (hadolint)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker is not available on this runner, so hadolint cannot run - failing the gate rather than skipping it."
            exit 1
          fi

          # Fail fast with a clear message if the linter image cannot be obtained or run.
          if ! docker run --rm --entrypoint /bin/hadolint hadolint/hadolint:latest --version; then
            echo "::error::hadolint (hadolint/hadolint:latest) could not be executed - refusing to pass the gate silently."
            exit 1
          fi

          mapfile -t dockerfiles < <(git ls-files | grep -E '(^|/)Dockerfile[^/]*$' || true)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "::warning::No tracked Dockerfiles found - the Dockerfile gate has nothing to check."
            exit 0
          fi

          echo "Tracked Dockerfiles to check (${#dockerfiles[@]}):"
          printf '  %s\n' "${dockerfiles[@]}"

          failed=0
          for f in "${dockerfiles[@]}"; do
            echo "::group::hadolint $f"
            rc=0
            output="$(docker run --rm -i --entrypoint /bin/hadolint hadolint/hadolint:latest --failure-threshold error - < "$f" 2>&1)" || rc=$?
            if [ -n "$output" ]; then
              echo "$output"
            fi
            echo "::endgroup::"
            if [ "$rc" -eq 1 ]; then
              echo "::error file=$f::hadolint reported errors in $f"
              failed=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error file=$f::hadolint could not be executed for $f (docker exit $rc)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Dockerfile gate FAILED - offending files are listed above."
            exit 1
          fi
          echo "Dockerfile gate PASSED: hadolint reported no errors in ${#dockerfiles[@]} tracked Dockerfile(s)."
